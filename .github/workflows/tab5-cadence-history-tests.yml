name: Tab5 cadence and LoRa history

on:
  pull_request:
    paths:
      - 'apps/orcsdr-tab5/ui/**'
      - 'tests/home_cadence_tests.cpp'
      - 'tests/waterfall_style_tests.cpp'
      - 'tests/lora_history_tests.cpp'
      - 'tests/setup_navigation_pause_test.py'
      - 'tests/location_task_lifetime_test.py'
      - 'tests/orcdial_init_backoff_test.py'
      - 'tests/adsb_zoom_redraw_test.py'
      - 'tools/test-tab5-cadence-history.sh'
      - '.github/workflows/tab5-cadence-history-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash tools/test-tab5-cadence-history.sh
